server {
    # Azure App Service default port for Linux containers
    listen 8080;
    server_name _;
    
    # Azure App Service default document root
    root /home/site/wwwroot;
    
    index index.php index.html index.htm;

    # Route all requests
    location / {
        # Serve file directly if it exists, otherwise route to public/index.php
        # Removed $uri/ to prevent 403 Forbidden when accessing the root directory
        try_files $uri /public/index.php?$query_string;
    }

    # Specifically allow static files in public directory
    location /public/ {
        try_files $uri $uri/ /public/index.php?$query_string;
    }

    # Handle PHP execution via FastCGI
    location ~ \.php$ {
        include fastcgi_params;
        # Azure App Service PHP-FPM listens on 127.0.0.1:9000
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        
        # Optional: Hide PHP version
        fastcgi_hide_header X-Powered-By;
    }

    # Deny access to .htaccess, .env and other hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
